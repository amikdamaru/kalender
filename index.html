<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
        }

        .app { width: 100%; max-width: 420px; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        header h1 { font-size: 20px; margin: 0; text-align: center; flex: 1; }

        button {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 16px;
            cursor: pointer;
        }
        button:active { background: #333; }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .dow {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            padding: 6px 0;
        }
        .dow.sun { color: #ff6b6b; }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1b1b1b;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            position: relative;
            user-select: none;
        }
        .day.empty { background: transparent; cursor: default; }
        .day.sun { color: #ff6b6b; }
        .day.today { outline: 2px solid #00bcd4; }
        .day.selected { background: #00bcd4; color: #000; }
        .day.has-note::after {
            content: "";
            position: absolute;
            bottom: 6px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffc107;
        }

        .toolbar { display: flex; justify-content: center; margin-top: 12px; }

        .note {
            margin-top: 16px;
            background: #1b1b1b;
            border-radius: 8px;
            padding: 12px;
        }
        .note h2 { font-size: 15px; margin: 0 0 8px; color: #ccc; font-weight: normal; }
        .note textarea {
            width: 100%;
            min-height: 90px;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
        }
        .note .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
        .note .status { flex: 1; font-size: 13px; color: #8bc34a; align-self: center; }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <button id="prev" aria-label="Bulan sebelumnya">&#8249;</button>
            <h1 id="title"></h1>
            <button id="next" aria-label="Bulan berikutnya">&#8250;</button>
        </header>

        <div class="grid" id="grid"></div>

        <div class="toolbar">
            <button id="today-btn">Hari ini</button>
        </div>

        <div class="note">
            <h2 id="note-title"></h2>
            <textarea id="note-text" placeholder="Tulis catatan untuk tanggal ini..."></textarea>
            <div class="actions">
                <span class="status" id="status"></span>
                <button id="delete">Hapus</button>
                <button id="save">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const DAYS = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
        const DAYS_FULL = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const STORAGE_KEY = 'kalender-notes';

        const grid = document.getElementById('grid');
        const title = document.getElementById('title');
        const noteTitle = document.getElementById('note-title');
        const noteText = document.getElementById('note-text');
        const status = document.getElementById('status');

        const today = new Date();
        let viewYear = today.getFullYear();
        let viewMonth = today.getMonth();
        let selected = keyOf(today);

        function keyOf(d) {
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${m}-${day}`;
        }

        function loadNotes() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
            catch (e) { return {}; }
        }

        function saveNotes(notes) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); return true; }
            catch (e) { return false; }
        }

        function render() {
            const notes = loadNotes();
            title.textContent = `${MONTHS[viewMonth]} ${viewYear}`;
            grid.innerHTML = '';

            DAYS.forEach((d, i) => {
                const el = document.createElement('div');
                el.className = 'dow' + (i === 0 ? ' sun' : '');
                el.textContent = d;
                grid.appendChild(el);
            });

            const firstDow = new Date(viewYear, viewMonth, 1).getDay();
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

            for (let i = 0; i < firstDow; i++) {
                const el = document.createElement('div');
                el.className = 'day empty';
                grid.appendChild(el);
            }

            const todayKey = keyOf(today);
            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(viewYear, viewMonth, d);
                const key = keyOf(date);
                const el = document.createElement('div');
                el.className = 'day';
                if (date.getDay() === 0) el.classList.add('sun');
                if (key === todayKey) el.classList.add('today');
                if (key === selected) el.classList.add('selected');
                if (notes[key]) el.classList.add('has-note');
                el.textContent = d;
                el.addEventListener('click', () => {
                    selected = key;
                    render();
                });
                grid.appendChild(el);
            }

            const [y, m, d] = selected.split('-').map(Number);
            const sel = new Date(y, m - 1, d);
            noteTitle.textContent = `${DAYS_FULL[sel.getDay()]}, ${d} ${MONTHS[m - 1]} ${y}`;
            noteText.value = notes[selected] || '';
            status.textContent = '';
        }

        function changeMonth(delta) {
            viewMonth += delta;
            if (viewMonth < 0) { viewMonth = 11; viewYear--; }
            if (viewMonth > 11) { viewMonth = 0; viewYear++; }
            render();
        }

        document.getElementById('prev').addEventListener('click', () => changeMonth(-1));
        document.getElementById('next').addEventListener('click', () => changeMonth(1));

        document.getElementById('today-btn').addEventListener('click', () => {
            viewYear = today.getFullYear();
            viewMonth = today.getMonth();
            selected = keyOf(today);
            render();
        });

        document.getElementById('save').addEventListener('click', () => {
            const notes = loadNotes();
            const text = noteText.value.trim();
            if (text) notes[selected] = text; else delete notes[selected];
            const ok = saveNotes(notes);
            render();
            status.textContent = ok ? 'Tersimpan' : 'Gagal menyimpan';
        });

        document.getElementById('delete').addEventListener('click', () => {
            const notes = loadNotes();
            delete notes[selected];
            saveNotes(notes);
            render();
            status.textContent = 'Dihapus';
        });

        // Geser kiri/kanan untuk ganti bulan
        let touchX = null;
        grid.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
        grid.addEventListener('touchend', (e) => {
            if (touchX === null) return;
            const dx = e.changedTouches[0].clientX - touchX;
            if (Math.abs(dx) > 50) changeMonth(dx < 0 ? 1 : -1);
            touchX = null;
        });

        render();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
    </script>
</body>
</html>
