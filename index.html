<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kalender</title>
  <meta name="description" content="Kalender bulanan minimalis dengan hari libur nasional dan cuti bersama Indonesia.">
  <meta name="theme-color" content="#FAFAF8">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kalender">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/main.js">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <span class="brand"><span class="brand-mark" aria-hidden="true"></span>Kalender</span>
      <p class="today-label" id="today-label" aria-live="polite"></p>
    </header>

    <nav class="month-bar" aria-label="Navigasi bulan">
      <button type="button" class="month-button" id="month-button" aria-haspopup="dialog">
        <span class="month-name" id="month-name"></span>
        <span class="month-year" id="month-year"></span>
        <svg class="month-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </nav>

    <div class="weekdays" aria-hidden="true">
      <span class="weekday weekday-week"></span>
      <span class="weekday">Senin</span>
      <span class="weekday">Selasa</span>
      <span class="weekday">Rabu</span>
      <span class="weekday">Kamis</span>
      <span class="weekday is-friday">Jumat</span>
      <span class="weekday is-weekend">Sabtu</span>
      <span class="weekday is-weekend">Minggu</span>
    </div>

    <main class="calendar-viewport" id="calendar-viewport"></main>
  </div>

  <dialog class="picker" id="month-picker" aria-label="Pilih bulan dan tahun"></dialog>

  <noscript><p class="noscript">Aktifkan JavaScript untuk menggunakan Kalender.</p></noscript>
</body>
</html>
